<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --mint: #A6E9A9;
    --dark: #0B2313;
  }
  html, body { width: 1080px; height: 1080px; overflow: hidden; }
  body {
    background: var(--mint);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--dark);
    position: relative;
  }
  .mono {
    font-family: "SF Mono", Menlo, monospace;
    font-weight: 700;
    letter-spacing: 0.08em;
  }
  .grid { position: absolute; inset: 0; }
  .line-h { position: absolute; left: 0; right: 0; height: 2px; background: var(--dark); }
  .line-v { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--dark); }

  /* ---- Row 1: logo block + info cells ---- */
  .logoblock {
    position: absolute; left: 0; top: 26px; width: 560px; height: 252px;
    background: var(--dark);
    display: flex; align-items: center; justify-content: center;
  }
  .info-top {
    position: absolute; left: 560px; top: 26px; width: 322px; height: 126px;
    padding: 26px 0 0 30px;
    font-size: 27px; line-height: 1.35;
  }
  .info-bottom {
    position: absolute; left: 560px; top: 152px; width: 322px; height: 126px;
    padding: 0 0 0 30px;
    display: flex; align-items: flex-end; padding-bottom: 26px;
    font-size: 21px; letter-spacing: 0.05em !important;
  }
  .shopify-cell {
    position: absolute; left: 882px; top: 26px; width: 198px; height: 252px;
    display: flex; align-items: center; justify-content: center;
  }

  /* ---- Row 2: headline ---- */
  .headline {
    position: absolute; left: 0; top: 278px; width: 1080px; height: 250px;
    display: flex; align-items: center; padding-left: 56px;
    font-size: 96px; font-weight: 500; letter-spacing: -0.01em;
  }

  /* ---- Row 3: name band ---- */
  .name-cell {
    position: absolute; left: 0; top: 528px; width: 560px; height: 96px;
    display: flex; align-items: center; padding-left: 56px;
    font-size: 27px;
  }
  .role-cell {
    position: absolute; left: 560px; top: 528px; width: 520px; height: 96px;
    display: flex; flex-direction: column; justify-content: center; padding-left: 30px;
    font-size: 24px; line-height: 1.4;
  }

  /* ---- Row 4: blobs + photo ---- */
  .blob-cell {
    position: absolute; left: 0; top: 624px; width: 560px; height: 430px;
    overflow: hidden;
  }
  .photo-cell {
    position: absolute; left: 560px; top: 624px; width: 520px; height: 430px;
    background: #d7d7d3;
    overflow: hidden;
  }
  .photo-cell img {
    width: 100%; height: 100%; object-fit: cover;
    filter: grayscale(1) contrast(1.05);
  }
  .photo-placeholder {
    width: 100%; height: 100%;
    background: linear-gradient(180deg, #e3e3df 0%, #c9c9c4 100%);
    position: relative;
  }
  .photo-note {
    position: absolute; bottom: 18px; left: 0; right: 0; text-align: center;
    font-family: "SF Mono", Menlo, monospace; font-size: 17px; letter-spacing: 0.12em;
    color: #8a8a86;
  }
</style>

<div class="grid">
  <!-- outer margins + grid lines -->
  <div class="line-h" style="top: 24px;"></div>
  <div class="line-h" style="top: 276px;"></div>
  <div class="line-h" style="top: 526px;"></div>
  <div class="line-h" style="top: 622px;"></div>
  <div class="line-h" style="top: 1054px;"></div>
  <div class="line-v" style="left: 558px; top: 26px; height: 252px; bottom: auto;"></div>
  <div class="line-v" style="left: 558px; top: 528px; bottom: 26px;"></div>
  <div class="line-v" style="left: 880px; top: 26px; height: 252px; bottom: auto;"></div>
  <div class="line-h" style="top: 150px; left: 560px; right: 200px;"></div>
</div>

<!-- Logo block: dotted DOTDEV + solid 2026 -->
<div class="logoblock">
  <svg width="470" height="190" viewBox="0 0 470 190">
    <defs>
      <pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse">
        <circle cx="6.5" cy="6.5" r="4.6" fill="#A6E9A9"/>
      </pattern>
    </defs>
    <text x="0" y="82" font-family="Helvetica Neue, Arial" font-weight="800" font-size="98"
          letter-spacing="2" fill="url(#dots)">DOT</text>
    <text x="0" y="176" font-family="Helvetica Neue, Arial" font-weight="800" font-size="98"
          letter-spacing="2" fill="url(#dots)">DEV</text>
    <text x="248" y="82" font-family="Helvetica Neue, Arial" font-weight="700" font-size="100"
          fill="#A6E9A9">20</text>
    <text x="248" y="176" font-family="Helvetica Neue, Arial" font-weight="700" font-size="100"
          fill="#A6E9A9">26</text>
  </svg>
</div>

<div class="info-top mono">JULY 21-22<br>TORONTO</div>
<div class="info-bottom mono">DOTDEV.SHOPIFY.COM</div>

<!-- Shopify bag glyph -->

  <svg width="96" height="108" viewBox="0 0 96 108" style="transform: rotate(-7deg);">
    <path d="M20 30 C18 12 26 3 36 2 C46 1 54 9 56 24" fill="none" stroke="#0B2313" stroke-width="8"/>
    <rect x="6" y="24" width="76" height="80" rx="6" fill="#0B2313"/>
    <text x="28" y="86" font-family="Helvetica Neue, Arial" font-weight="800" font-size="48"
          fill="#A6E9A9">S</text>
  </svg>
</div>

<div class="headline">See you at DotDev</div>

<div class="name-cell mono">LIOR POZIN</div>
<div class="role-cell mono">ATTENDING<br>CEO @ AUTODS</div>

<!-- decorative blobs -->
<div class="blob-cell">
  <svg width="560" height="430" viewBox="0 0 560 430">
    <circle cx="90" cy="120" r="105" fill="#0B2313"/>
    <path d="M-40 430 L-40 300 C60 240 200 250 280 330 C340 390 420 400 560 370 L560 430 Z" fill="#0B2313"/>
    <circle cx="450" cy="90" r="70" fill="#0B2313"/>
  </svg>
</div>

<!-- photo cell: swap the placeholder div for <img src="lior-headshot.jpg"> -->

  <div class="photo-placeholder">
    <div class="photo-note">DROP LIOR B&amp;W HEADSHOT HERE</div>
  </div>
</div>

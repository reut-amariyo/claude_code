<!DOCTYPE html><html><head><meta charset="utf-8"><title>Lior Day Panels</title>
<style>
@font-face{font-family:Inter;src:url('../../T-tools/assets/fonts/Inter-Bold.ttf');font-weight:700}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;height:680px;background:#fff;font-family:Inter,sans-serif;overflow:hidden;position:relative}
.row{display:flex;height:100%}
.p{flex:1;display:flex;flex-direction:column;border-right:3px solid #fff}
.p:last-child{border-right:0}
.time{height:120px;display:flex;align-items:center;justify-content:center;font-size:76px;font-weight:700;color:#14213D;letter-spacing:-2px}
.ph{flex:1;background:#cfd3d8 center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#6b7280;font-size:24px;font-weight:700}
.title{position:absolute;left:0;right:0;bottom:44px;text-align:center;color:#fff;font-size:92px;font-weight:700;letter-spacing:-3px;text-shadow:0 4px 24px rgba(0,0,0,.55)}
</style></head><body>
<div class="row">
 <div class="p"><div class="time">9:00 AM</div><div class="ph" style="background-image:url('photo-gym.jpg')">GYM PHOTO</div></div>
 <div class="p"><div class="time">10:45 AM</div><div class="ph" style="background-image:url('photo-office.jpg')">OFFICE / LAPTOP PHOTO</div></div>
 <div class="p"><div class="time">6:30 PM</div><div class="ph" style="background-image:url('photo-home.jpg')">HOME / RAY PHOTO</div></div>
</div>
<div class="title">No 5 a.m. Alarm</div>
</body></html>

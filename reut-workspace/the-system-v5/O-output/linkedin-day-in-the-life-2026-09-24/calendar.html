<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Lior Calendar</title>
<style>
@font-face{font-family:Inter;src:url('../../T-tools/assets/fonts/Inter-Regular.ttf');font-weight:400}
@font-face{font-family:Inter;src:url('../../T-tools/assets/fonts/Inter-SemiBold.ttf');font-weight:600}
@font-face{font-family:Inter;src:url('../../T-tools/assets/fonts/Inter-Bold.ttf');font-weight:700}
:root{--bg:#fff;--line:#e6e6e6;--muted:#70757a;--meet:#C5CA52;--meetText:#fff;--prot:#1F2A44;--agent:#7B61FF;--soft:#EEF0DA}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1350px;background:var(--bg);font-family:Inter,-apple-system,sans-serif;overflow:hidden;position:relative}
.head{position:absolute;top:0;left:0;right:0;height:150px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 44px}
.date .d{font-size:22px;color:var(--muted);font-weight:600;letter-spacing:.5px}
.date .n{font-size:52px;font-weight:700;color:#1f1f1f;line-height:1.1}
.who{display:flex;align-items:center;gap:18px}
.who .name{font-size:30px;color:#1f1f1f;text-align:right}
.who .tag{display:inline-block;margin-top:6px;background:#F3F5DA;color:#5b6116;font-size:20px;font-weight:600;padding:4px 12px;border-radius:8px}
.who img{width:92px;height:92px;border-radius:50%;object-fit:cover}
.grid{position:absolute;top:150px;left:0;right:0;bottom:0}
.hr{position:absolute;left:96px;right:0;border-top:1px solid var(--line)}
.hl{position:absolute;left:0;width:84px;text-align:right;font-size:17px;color:var(--muted);transform:translateY(-10px)}
.ev{position:absolute;border-radius:10px;padding:5px 12px;overflow:hidden;border:2px solid #fff;line-height:1.15}
.ev .t{font-size:21px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .s{font-size:17px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meet{background:var(--meet);color:var(--meetText)}
.prot{background:var(--prot);color:#fff}
.agent{background:var(--agent);color:#fff}
.soft{background:var(--soft);color:#4a4f12}
.ev.row{display:flex;align-items:center;gap:10px}.ev.row .t{font-size:18px}.ev.row .s{font-size:15px}
.ev.row .s{opacity:.85}
</style></head><body>
<div class="head">
  <div class="date"><div class="d">THURSDAY</div><div class="n">Sep 24</div></div>
  <div class="who"><div><div class="name">Lior Pozin</div><div style="text-align:right"><span class="tag">▦ Office</span></div></div><img src="avatar.jpg"></div>
</div>
<div class="grid" id="g"></div>
<script>
const START=8.25, END=23.5, TOP=16, H=1350-150-16-16, PX=H/(END-START), L=104, W=1080-L-24;
const g=document.getElementById('g');
for(let h=9;h<=23;h++){
  const y=TOP+(h-START)*PX;
  g.insertAdjacentHTML('beforeend',`<div class="hr" style="top:${y}px"></div><div class="hl" style="top:${y}px">${h>12?h-12:h} ${h>=12?'PM':'AM'}</div>`);
}
const t=s=>{const[a,b]=s.split(':').map(Number);return a+b/60};
// [start,end,title,sub,type,col,cols]
const E=[
 ['8:30','9:00','Slack, Instagram, matcha + Ray','','soft',0,1],
 ['9:00','10:00','Gym','Protected','prot',0,1],
 ['10:15','10:40','Walk to office','Voice notes to AI agents','soft',0,1],
 ['10:40','11:00','Commit: 2-3 big things','AI agent','agent',0,1],
 ['11:00','11:45','Weekly 1:1 - Marketing','','meet',0,1],
 ['11:45','12:30','Product roadmap review','','meet',0,2],
 ['11:45','12:05','Agent check-in 1/3','','agent',1,2],
 ['12:10','12:55','Legal review','','meet',1,2],
 ['12:30','13:15','Weekly 1:1 - Finance','','meet',0,2],
 ['13:00','13:45','Lunch','','meet',1,2],
 ['13:15','13:45','Hiring pipeline','','meet',0,2],
 ['13:45','14:30','Weekly OKRs sync','','meet',0,1],
 ['14:30','16:30','Management meeting','Q4 OKR overview + budget','meet',0,1],
 ['15:30','15:50','Agent check-in 2/3','','agent',1,2],
 ['16:30','17:00','Candidate interview','','meet',0,1],
 ['17:00','17:30','Partner call','','meet',0,2],
 ['17:00','17:45','Team leads sync','','meet',1,2],
 ['17:45','18:15','Board deck review','','meet',0,2],
 ['17:55','18:15','Agent check-in 3/3','','agent',1,2],
 ['18:30','19:30','Dinner at home','Protected','prot',0,1],
 ['19:30','20:30','Coach','Protected','prot',0,1],
 ['20:30','23:00','Laptop opens again','By choice','meet',0,1],
 ['23:00','23:25','Breathing, then sleep','','soft',0,1],
];
for(const[s,e,ti,sub,ty,c,n] of E){
  const y=TOP+(t(s)-START)*PX, h=(t(e)-t(s))*PX, w=W/n, x=L+c*w;
  const short=h<44;
  const inner= short ? `<span class="t">${ti}</span>${sub?`<span class="s">${sub}</span>`:''}` : `<div class="t">${ti}</div>${sub?`<div class="s">${sub}</div>`:''}`;
  g.insertAdjacentHTML('beforeend',`<div class="ev ${ty} ${short?'row':''}" style="top:${y}px;left:${x}px;width:${w}px;height:${h}px;${short?'padding-top:0;padding-bottom:0':''}">${inner}</div>`);
}
</script>
</body></html>

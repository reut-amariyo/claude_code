(()=>{'use strict';
const LOOP=10,TOP=375,BASE=745,HEIGHT=BASE-TOP,MAX=1850,LOW=1550;
const $=id=>document.getElementById(id);
const bars=[$('bar-a'),$('bar-b')],caps=[$('cap-a'),$('cap-b')],values=[$('score-a'),$('score-b')];
const ticks=Array.from({length:7},(_,i)=>$(`tick-${i}`)),tickLabels=Array.from({length:7},(_,i)=>$(`tick-label-${i}`));
const finalTicks=[0,300,600,900,1200,1500,1850];
const clamp=x=>Math.min(1,Math.max(0,x));
const smooth=x=>{x=clamp(x);return x*x*x*(x*(x*6-15)+10)};
const mix=(a,b,t)=>a+(b-a)*t;
const fmt=n=>Math.round(n).toLocaleString('en-US');
function stateAt(seconds){
 const t=((seconds%LOOP)+LOOP)%LOOP;
 let growth=t<2.25?smooth(t/2.25):1;
 let morph=t<4?0:t<6.5?smooth((t-4)/2.5):1;
 let bracket=t<6.5?0:smooth((t-6.5)/.35);
 // The last second is the loop bridge. At 11s every animated property and its
 // first derivative match 0s, so autoplay never cuts from full bars to empty.
 if(t>=10){const back=smooth(t-10);growth=1-back;morph=1-back;bracket=1-smooth((t-10)/.25);}
 // Interpolate inverse range: for fixed scores this gives a smooth, evenly
 // paced height morph instead of a front-loaded jump as the denominator grows.
 const invRange=mix(1/(MAX-LOW),1/MAX,morph);
 const min=MAX-1/invRange;
 const scores=[1797,1762].map(n=>mix(LOW,n,growth));
 const heights=scores.map(n=>Math.max(0,(n-min)*invRange*HEIGHT));
 const tops=heights.map(h=>BASE-h);
 const tickData=finalTicks.map((n,i)=>{
  const fraction=mix(i/6,n/MAX,morph)+Math.sin(Math.PI*morph)*Math.sin(Math.PI*i/6)*.065;
  return {value:min+fraction/invRange,y:BASE-fraction*HEIGHT};
 });
 return {t,min,morph,growth,bracket,scores,heights,tops,ticks:tickData};
}
function render(seconds){
 const s=stateAt(seconds);
 bars.forEach((bar,i)=>{bar.setAttribute('y',s.tops[i].toFixed(4));bar.setAttribute('height',s.heights[i].toFixed(4));caps[i].setAttribute('transform',`translate(${i?700:360} ${s.tops[i].toFixed(4)})`);values[i].textContent=fmt(s.scores[i]);});
 s.ticks.forEach((tick,i)=>{ticks[i].setAttribute('transform',`translate(0 ${tick.y.toFixed(4)})`);tickLabels[i].textContent=fmt(tick.value);});

 $('difference').setAttribute('opacity',s.bracket.toFixed(4));
 $('bracket').setAttribute('d',`M452 ${a}H530V${b}H608`);
 $('leader').setAttribute('d',`M530 ${a-152}V${(a+b)/2}`);
 $('difference-label').setAttribute('y',(a-164).toFixed(4));
 return s;
}
let start=null;
function frame(now){if(start===null)start=now;render((now-start)/1000);requestAnimationFrame(frame);}

})();
